<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9c74f"/>
      <stop offset="100%" stop-color="#f8961e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Sun Circle in upper right -->
  <circle cx="340" cy="180" r="65" fill="url(#sun)"/>

  <!-- Sun Rays -->
  <g stroke="url(#sun)" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="340" y1="90" x2="340" y2="70" />
    <line x1="420" y1="130" x2="435" y2="120" />
    <line x1="430" y1="210" x2="450" y2="215" />
    <line x1="260" y1="130" x2="245" y2="120" />
  </g>

  <!-- Cloud Base -->
  <path d="M160 320 h170 a55 55 0 0 0 10 -108 a75 75 0 0 0 -138 -22 a55 55 0 0 0 -42 130 z" fill="#ffffff" opacity="0.95"/>

  <!-- Wind Wave Lines -->
  <path d="M120 360 q 70 -20 140 0 t 120 -5" fill="none" stroke="#52b788" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 395 q 60 -15 120 0 t 90 -5" fill="none" stroke="#74c69d" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <!-- Agricultural Sprout/Leaf rising up -->
  <path d="M210 320 C 190 260 230 220 280 215 C 285 265 250 300 210 320 Z" fill="url(#leaf)"/>
  <path d="M215 315 C 230 280 255 255 275 220" fill="none" stroke="#d8f3dc" stroke-width="4" stroke-linecap="round"/>
</svg>
